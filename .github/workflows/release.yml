name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            bin_name: flareTUI
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            bin_name: flareTUI
            use_cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            bin_name: flareTUI
          - target: aarch64-apple-darwin
            os: macos-latest
            bin_name: flareTUI
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            bin_name: flareTUI.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build release binary
        shell: bash
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Package release archive
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          ARCHIVE="flareTUI-${VERSION}-${{ matrix.target }}"
          mkdir -p "dist/${ARCHIVE}"
          cp "target/${{ matrix.target }}/release/${{ matrix.bin_name }}" "dist/${ARCHIVE}/"
          cp README.md LICENSE-MIT LICENSE-APACHE "dist/${ARCHIVE}/"
          cd dist
          tar -czvf "${ARCHIVE}.tar.gz" "${ARCHIVE}"
          sha256sum "${ARCHIVE}.tar.gz" > "${ARCHIVE}.tar.gz.sha256"
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "${ARCHIVE}.zip" "${ARCHIVE}"
            sha256sum "${ARCHIVE}.zip" > "${ARCHIVE}.zip.sha256"
          fi

      - name: Upload assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
